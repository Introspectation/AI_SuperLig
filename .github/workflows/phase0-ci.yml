name: Data foundation CI

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: data-foundation-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt

      - name: Run regression tests
        run: python -m unittest discover -s tests -v

      - name: Rebuild audited data foundation without network access
        run: python scripts/run_data_foundation.py

      - name: Verify committed outputs are reproducible
        run: >-
          git diff --exit-code --
          DATA_CONTRACT.md
          data/processed
          reports
          config/expected_schemas.json

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-foundation-outputs
          path: |
            DATA_CONTRACT.md
            LEAKAGE_CONTRACT.md
            MODEL_DESIGN.md
            data/processed/
            reports/
          if-no-files-found: error
          retention-days: 14
